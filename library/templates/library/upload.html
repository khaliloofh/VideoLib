<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Video yüklə</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: #121212;
        color: #eee;
        font-family: -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .box {
        background: #1e1e1e;
        border-radius: 12px;
        padding: 36px;
        width: 100%;
        max-width: 420px;
    }

    .box h1 {
        font-size: 20px;
        margin: 0 0 24px 0;
        text-align: center;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        font-size: 13px;
        color: #999;
        margin-bottom: 6px;
    }

    .field input[type="text"] {
        width: 100%;
        background: #121212;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 14px;
    }

    .field input[type="text"]:focus {
        outline: none;
        border-color: #CC785C;
    }

    .field input[type="file"] {
        width: 100%;
        background: #121212;
        color: #999;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
    }

    .submit-btn {
        width: 100%;
        background: #CC785C;
        color: #121212;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
    }

    .submit-btn:hover {
        background: #d98a6f;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #777;
        text-decoration: none;
        font-size: 13px;
    }

    .back-link:hover {
        color: #CC785C;
    }

    .errorlist {
        list-style: none;
        padding: 0;
        margin: 6px 0 0 0;
        color: #e06c5c;
        font-size: 12px;
    }
</style>
</head>
<body>

    <div class="box">
        <h1>Video yüklə</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="field">
                <label for="{{ form.title.id_for_label }}">Başlıq</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div class="field">
                <label for="{{ form.file.id_for_label }}">Fayl</label>
                {{ form.file }}
                {{ form.file.errors }}
            </div>
                        <div class="field">
                <label for="{{ form.subtitle.id_for_label }}">Altyazı (.srt / .vtt) — istəyə bağlı</label>
                {{ form.subtitle }}
                {{ form.subtitle.errors }}
            </div>
            <button class="submit-btn" type="submit">Yüklə</button>
        </form>
        <a class="back-link" href="{% url 'library:video_list' %}">← Geri</a>
    </div>

</body>
</html>
